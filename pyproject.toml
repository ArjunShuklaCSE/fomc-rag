[project]
name = "fomc-rag"
version = "0.1.0"
description = "Measured retrieval over 18 years of Federal Reserve FOMC documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fomcrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
