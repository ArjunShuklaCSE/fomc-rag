[project]
name = "fomc-rag"
version = "0.1.0"
description = "Measured hybrid retrieval over Federal Reserve FOMC documents, 1980-2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.3",
    "numpy>=1.26",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "tokenizers>=0.19",
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43; sys_platform != 'darwin'",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

# CUDA wheels on Windows (dev laptop), CPU wheels on Linux (Docker, CI): keeps the image ~1 GB smaller
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fomcrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
